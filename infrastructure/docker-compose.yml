# Local infrastructure for CL Buddy.
#
# Every port is bound to 127.0.0.1 on purpose: Qdrant ships without
# authentication and Ollama has none at all, so neither should ever be
# reachable from your network.
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#   docker compose -f infrastructure/docker-compose.yml --profile ollama up -d   # also run Ollama in Docker

name: clbuddy

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # REST + dashboard (http://localhost:6333/dashboard)
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clbuddy
      POSTGRES_PASSWORD: clbuddy_dev
      POSTGRES_DB: clbuddy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clbuddy -d clbuddy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: most people run Ollama natively (it can use the Metal/CUDA GPU
  # directly). Enable with `--profile ollama`, then:
  #   docker exec -it clbuddy-ollama-1 ollama pull qwen3:8b
  #   docker exec -it clbuddy-ollama-1 ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  postgres_data:
  ollama_data:
